<!DOCTYPE html>
<html lang="en-IN">
<head>
  <meta charset="UTF-8">
  <title>404 – Page Not Found</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="prefetch" href="/logo.png" as="image">
  <link rel="icon" href="/logo.png">
  <meta name="robots" content="noindex, follow">

  <style>
    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #ffffff;
      color: #111;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .container {
      max-width: 520px;
      padding: 20px;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 20px;
      font-weight: 700;
    }

    .tiles {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 20px;
    }

    .tile {
      width: 52px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      font-weight: 700;
      border-radius: 6px;
      color: #fff;
    }

    .green { background: #6aaa64; }
    .yellow { background: #c9b458; }
    .gray { background: #787c7e; }

    p {
      font-size: 15px;
      color: #555;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }

    .btn {
      padding: 12px 18px;
      background: #e9ecef;
      color: #111;
      text-decoration: none;
      border-radius: 24px;
      font-size: 14px;
      font-weight: 500;
      transition: background 0.2s ease;
    }

    .btn:hover {
      background: #d6d8db;
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 34px;
      }
      .tile {
        width: 46px;
        height: 46px;
        font-size: 22px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>404 – Page Not Found</h1>

    <div class="tiles">
      <div class="tile green">S</div>
      <div class="tile yellow">S</div>
      <div class="tile gray">O</div>
      <div class="tile gray">I</div>
      <div class="tile gray">D</div>
    </div>

    <p>
      Looks like this page doesn’t exist or the link is incorrect.  
      You can continue using SSO ID services from the links below.
    </p>

    <div class="buttons">
      <a href="/" class="btn">Go to Home</a>
      <a href="/sso-id-login/" class="btn">SSO ID Login</a>
      <a href="/sso-id-registration/" class="btn">SSO ID Registration</a>
      <a href="/forget-sso-id-and-password/" class="btn">Forgot SSO ID / Password</a>
    </div>
  </div>

</body>
</html>
